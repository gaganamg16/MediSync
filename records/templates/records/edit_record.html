<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Medical Record - MediSync</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button,
        .back-btn {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn {
            background: #64748b;
            margin-left: 8px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-btn:hover {
            background: #475569;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 20px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>MediSync</h1>
    </div>

    <div class="container">

        <div class="form-card">

            <h2>Edit Medical Record</h2>

            <form method="POST">

                {% csrf_token %}

                <label>Record Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ record.title }}"
                    required
                >

                <label>Record Date</label>

                <input
                    type="date"
                    name="record_date"
                    value="{{ record.record_date|date:'Y-m-d' }}"
                    required
                >

                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Enter a brief description"
                >{{ record.description }}</textarea>

                <button type="submit">
                    Save Changes
                </button>

                <a
                    class="back-btn"
                    href="{% url 'record_list' %}"
                >
                    Back
                </a>

            </form>

        </div>

    </div>

</body>
</html>
