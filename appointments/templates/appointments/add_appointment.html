<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Appointment - MediSync</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button,
        .back-btn {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn {
            background: #64748b;
            margin-left: 8px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>MediSync</h1>
    </div>

    <div class="container">

        <div class="form-card">

            <h2>Add Appointment</h2>

            <form method="POST">

                {% csrf_token %}

                <label>Doctor Name</label>
                <input
                    type="text"
                    name="doctor_name"
                    placeholder="Enter doctor name"
                    required
                >

                <label>Hospital Name</label>
                <input
                    type="text"
                    name="hospital_name"
                    placeholder="Enter hospital name"
                    required
                >

                <label>Appointment Date</label>
                <input
                    type="date"
                    name="appointment_date"
                    required
                >

                <label>Appointment Time</label>
                <input
                    type="time"
                    name="appointment_time"
                    required
                >

                <label>Notes</label>
                <textarea
                    name="notes"
                    placeholder="Enter appointment notes"
                ></textarea>

                <button type="submit">
                    Add Appointment
                </button>

                <a
                    class="back-btn"
                    href="{% url 'dashboard' %}"
                >
                    Back
                </a>

            </form>

        </div>

    </div>

</body>
</html>
