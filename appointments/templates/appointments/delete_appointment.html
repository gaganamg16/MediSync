<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Appointment - MediSync</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
        }

        .delete-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .delete-card h2 {
            margin-top: 0;
            color: #dc2626;
        }

        .details {
            text-align: left;
            background: #f8fafc;
            padding: 18px;
            border-radius: 8px;
            margin: 25px 0;
        }

        .details p {
            margin: 10px 0;
        }

        button,
        .cancel-btn {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background: #dc2626;
        }

        button:hover {
            background: #b91c1c;
        }

        .cancel-btn {
            background: #64748b;
            margin-left: 8px;
        }

        .cancel-btn:hover {
            background: #475569;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 20px;
            }

            .container {
                width: 94%;
                margin: 35px auto;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>MediSync</h1>
    </div>

    <div class="container">

        <div class="delete-card">

            <h2>Delete Appointment</h2>

            <p>
                Are you sure you want to delete this appointment?
            </p>

            <div class="details">

                <p>
                    <strong>Doctor:</strong>
                    {{ appointment.doctor_name }}
                </p>

                <p>
                    <strong>Hospital:</strong>
                    {{ appointment.hospital_name }}
                </p>

                <p>
                    <strong>Date:</strong>
                    {{ appointment.appointment_date }}
                </p>

                <p>
                    <strong>Time:</strong>
                    {{ appointment.appointment_time }}
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                <button type="submit">
                    Yes, Delete
                </button>

                <a
                    class="cancel-btn"
                    href="{% url 'appointment_list' %}"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
