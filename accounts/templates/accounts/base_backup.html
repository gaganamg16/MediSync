<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MediSync{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            margin: 0;
            font-size: 24px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
<link rel="stylesheet" href="{% static 'medisync/css/app.css' %}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        <h1>MediSync</h1>
    </div>

    {% if user.is_authenticated %}
    <div class="nav-links">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'medicine_list' %}">Medicines</a>
        <a href="{% url 'appointment_list' %}">Appointments</a>
        <a href="{% url 'record_list' %}">Records</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>
    {% endif %}

</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<script src="{% static 'medisync/js/app.js' %}" defer></script>
</body>
</html>
